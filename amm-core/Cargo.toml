[package]
name = "amm-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Wei-exact, no_std-capable AMM quoting primitives and traits behind an open Pool trait."

[dependencies]
alloy-primitives = { workspace = true }
num-bigint = "0.4"
num-rational = { version = "0.4", features = ["num-bigint"] }
num-traits = "0.2"
thiserror = { workspace = true }
serde = { version = "1", features = ["derive"], optional = true }
uniswap_v3_math = { version = "0.6", optional = true }
# Curve math is BSL-1.1 (free for research/testing/audit; commercial use needs a
# paid license). Only the opt-in `curve` feature pulls it; the core stays MIT/Apache.
curve-math = { git = "https://github.com/sunce86/curve-math", features = ["swap"], optional = true }

[features]
default = []
serde = ["dep:serde", "alloy-primitives/serde"]
uniswap-v2 = []
uniswap-v3 = ["dep:uniswap_v3_math"]
uniswap-v4 = ["dep:uniswap_v3_math"]
curve = ["dep:curve-math"]
aerodrome = ["dep:uniswap_v3_math"]

[dev-dependencies]
proptest = "1"
rstest = "0.26"

[lints]
workspace = true
