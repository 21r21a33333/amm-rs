[package]
name = "amm-rpc"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Optional alloy-backed on-chain state fetching for amm-core pools."

[dependencies]
amm-core = { path = "../amm-core", features = ["uniswap-v2", "aerodrome"] }
alloy = { version = "2.2.0", features = ["contract", "provider-http"] }
async-trait = "0.1"
thiserror = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[lints]
workspace = true
